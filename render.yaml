services:
  - type: web
    name: ai-chatbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: models/embedding-001
      - key: DATABASE_URL
        value: sqlite:///chatbot_memory.db
      - key: PDF_PATH
        value: ""
